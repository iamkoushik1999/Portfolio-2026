  <text x="600" y="310" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b96b8">Render by render-oss would like permission to access your account</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8b96b8">
    <text x="330" y="356"><tspan fill="#27c93f">&#10003; </tspan>Read access to code, commit statuses</text>
    <text x="330" y="382"><tspan fill="#27c93f">&#10003; </tspan>Read and write access to deployments</text>
    <text x="330" y="408"><tspan fill="#27c93f">&#10003; </tspan>Read-only access to your email address</text>
  </g>

  <rect x="440" y="440" width="320" height="46" rx="9" fill="#1f6feb" />
  <text x="600" y="468" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#f4f7ff">Authorize render-oss</text>

